name: Regen the hub.xreg.io site

on:
  repository_dispatch:
    type: [server_updated]
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: regen-site
  cancel-in-progress: false   # Force serialization of regen requests

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: write # Required to push changes back
      pages: write    # Required to update github pages
      statuses: write # Required to report status for the commit on repo page

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the site
        run: ./mksite

      - name: Commit and push changes
        id: git_check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add .

          # Only commit if there are actual changes to prevent workflow failure
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated rebuild of site"
            git push
          else
            echo "No changes detected. Skipping push."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        if: steps.git_check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy site
        if: steps.git_check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
