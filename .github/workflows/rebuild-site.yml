name: Regen the hub.xreg.io site & registry

on:
  repository_dispatch:
    type: [server_updated]
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'site/**'

concurrency:
  group: regen-site
  cancel-in-progress: false   # Force serialization of regen requests

jobs:
  update-repo:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      id-token: write # Required for OIDC authentication
      contents: write # Required to push changes back
      pages: write    # Required to update github pages
      statuses: write # Required to report status for the commit on repo page

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the site
        run: ./mksite

      - name: Commit and push changes
        id: git_check
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"

          git add .

          # Only commit if there are actual changes to prevent workflow failure
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Automated rebuild of site"
            git push
          else
            echo "No changes detected. Skipping push."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        if: steps.git_check.outputs.skip != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './site'

      - name: Deploy site
        if: steps.git_check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4

  status:
    name: post-commit-status
    runs-on: ubuntu-latest
    needs: [update-repo]
    if: ${{ always() }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Resolve latest main SHA
        id: head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          SHA="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/commits/main" | jq -r .sha)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved main SHA: $SHA"

      - name: Post success status
        if: ${{ needs.update-repo.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.head.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @- <<JSON
          {
            "state": "success",
            "context": "site/regenerate",
            "description": "Site regeneration completed",
            "target_url": "$RUN_URL"
          }
          JSON

      - name: Post failure status
        if: ${{ needs.update-repo.result != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.head.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$REPO/statuses/$SHA" \
            -d @- <<JSON
          {
            "state": "failure",
            "context": "site/regenerate",
            "description": "Site regeneration failed",
            "target_url": "$RUN_URL"
          }
          JSON
